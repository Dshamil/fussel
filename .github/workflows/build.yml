name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the macOS 26 SDK: use Xcode 26 when the runner has it.
      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build Fussel.app
        run: |
          chmod +x scripts/*.sh
          set -o pipefail
          scripts/build.sh "${{ steps.version.outputs.value }}" 2>&1 | tee build.log

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Build installer and disk image
        run: scripts/package.sh "${{ steps.version.outputs.value }}"

      # The self-updater only installs an installer whose signature matches the key built into Fussel.
      - name: Sign installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FUSSEL_SIGNING_KEY: ${{ secrets.FUSSEL_SIGNING_KEY }}
        run: swift scripts/sign-update.swift dist/Fussel-Installer.pkg > dist/Fussel-Installer.pkg.sig

      # Surface compiler errors as annotations, readable through the API.
      - name: Report build errors
        if: failure()
        run: |
          grep -hE "error:|failed" build.log test.log 2>/dev/null | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//$GITHUB_WORKSPACE\//}"
          done

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Fussel
          path: |
            dist/Fussel-Installer.pkg
            dist/Fussel.dmg
            dist/Fussel.zip

      - name: Render style previews
        continue-on-error: true
        timeout-minutes: 3
        run: dist/Fussel.app/Contents/MacOS/Fussel --render-previews "$PWD/previews"

      - name: Measure performance
        continue-on-error: true
        timeout-minutes: 4
        run: scripts/perf-probe.sh

      # Screenshots land on the ci-previews branch so they can be looked at without a Mac.
      - name: Publish previews
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          cd previews
          git init -q -b ci-previews
          git add .
          git -c user.name="Fussel CI" -c user.email="ci@fussel.invalid" commit -q -m "Previews for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-previews

      # A new release is published whenever VERSION changes to a number that has no release yet.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            NOTES="release-notes/$VERSION.md"
            TITLE="Fussel $VERSION Beta"
            if [ -f "$NOTES" ]; then
              NOTES_ARG=(--notes-file "$NOTES")
              # An optional first line "<!-- title: ... -->" names the release.
              CUSTOM=$(sed -n '1s/^<!-- title: \(.*\) -->$/\1/p' "$NOTES")
              if [ -n "$CUSTOM" ]; then TITLE="$CUSTOM"; fi
            else
              NOTES_ARG=(--generate-notes)
            fi
            gh release create "$TAG" dist/Fussel-Installer.pkg dist/Fussel-Installer.pkg.sig dist/Fussel.dmg dist/Fussel.zip \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              "${NOTES_ARG[@]}"
          fi
