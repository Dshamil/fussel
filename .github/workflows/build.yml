name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build Fussel.app
        run: |
          chmod +x scripts/*.sh
          scripts/build.sh "${{ steps.version.outputs.value }}"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Fussel
          path: dist/Fussel.zip

      # A new release is published whenever VERSION changes to a number that has no release yet.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" dist/Fussel.zip \
              --target "$GITHUB_SHA" \
              --title "Fussel $TAG" \
              --generate-notes
          fi
