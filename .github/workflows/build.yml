name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the macOS 26 SDK: use Xcode 26 when the runner has it.
      - name: Toolchain
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      # A fixed signing certificate, so macOS recognizes every new Fussel as the same app and keeps
      # its Full Disk Access across updates. Without the secret (pull requests), or if anything here
      # fails, the build falls back to the usual ad-hoc signature.
      - name: Signing certificate
        continue-on-error: true
        env:
          FUSSEL_CERT_P12: ${{ secrets.FUSSEL_CERT_P12 }}
          FUSSEL_CERT_PASSWORD: ${{ secrets.FUSSEL_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FUSSEL_CERT_P12:-}" ]; then echo "No certificate, building ad-hoc."; exit 0; fi
          KC="$RUNNER_TEMP/fussel.keychain-db"
          KPW=$(openssl rand -hex 16)
          echo "$FUSSEL_CERT_P12" | base64 --decode > "$RUNNER_TEMP/fussel.p12"
          security create-keychain -p "$KPW" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KPW" "$KC"
          security import "$RUNNER_TEMP/fussel.p12" -k "$KC" -P "$FUSSEL_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KPW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Self-made, so this build machine (and only it) has to be told to trust it for signing.
          /usr/bin/openssl pkcs12 -in "$RUNNER_TEMP/fussel.p12" -clcerts -nokeys \
            -passin env:FUSSEL_CERT_PASSWORD -out "$RUNNER_TEMP/fussel.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/fussel.pem"
          rm -f "$RUNNER_TEMP/fussel.p12"
          ID=$(security find-identity -v -p codesigning "$KC" | awk '/Fussel Code Signing/ {print $2; exit}')
          if [ -n "$ID" ]; then
            echo "FUSSEL_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
            echo "FUSSEL_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
            echo "Signing with the Fussel certificate."
          else
            echo "::warning::The certificate isn't usable for signing, building ad-hoc."
          fi

      - name: Build Fussel.app
        run: |
          chmod +x scripts/*.sh
          set -o pipefail
          scripts/build.sh "${{ steps.version.outputs.value }}" 2>&1 | tee build.log
          codesign -dr - dist/Fussel.app

      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log

      - name: Build installer and disk image
        run: scripts/package.sh "${{ steps.version.outputs.value }}"

      # The self-updater only installs an installer whose signature matches the key built into Fussel.
      - name: Sign installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FUSSEL_SIGNING_KEY: ${{ secrets.FUSSEL_SIGNING_KEY }}
        run: swift scripts/sign-update.swift dist/Fussel-Installer.pkg > dist/Fussel-Installer.pkg.sig

      # Surface compiler errors as annotations, readable through the API.
      - name: Report build errors
        if: failure()
        run: |
          grep -hE "error:|failed" build.log test.log 2>/dev/null | sort -u | head -40 | while IFS= read -r line; do
            echo "::error::${line//$GITHUB_WORKSPACE\//}"
          done

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Fussel
          path: |
            dist/Fussel-Installer.pkg
            dist/Fussel-Installer.zip
            dist/Fussel.dmg
            dist/Fussel.zip

      - name: Render style previews
        continue-on-error: true
        timeout-minutes: 3
        run: dist/Fussel.app/Contents/MacOS/Fussel --render-previews "$PWD/previews"

      - name: Measure performance
        continue-on-error: true
        timeout-minutes: 4
        run: scripts/perf-probe.sh

      # Screenshots land on the ci-previews branch so they can be looked at without a Mac.
      - name: Publish previews
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          cd previews
          git init -q -b ci-previews
          git add .
          git -c user.name="Fussel CI" -c user.email="ci@fussel.invalid" commit -q -m "Previews for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-previews

      # A new release is published whenever VERSION changes to a number that has no release yet.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            NOTES="release-notes/$VERSION.md"
            TITLE="Fussel $VERSION Beta"
            if [ -f "$NOTES" ]; then
              NOTES_ARG=(--notes-file "$NOTES")
              # An optional first line "<!-- title: ... -->" names the release.
              CUSTOM=$(sed -n '1s/^<!-- title: \(.*\) -->$/\1/p' "$NOTES")
              if [ -n "$CUSTOM" ]; then TITLE="$CUSTOM"; fi
            else
              NOTES_ARG=(--generate-notes)
            fi
            gh release create "$TAG" dist/Fussel-Installer.zip dist/Fussel-Installer.pkg dist/Fussel-Installer.pkg.sig dist/Fussel.dmg dist/Fussel.zip \
              --latest \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              "${NOTES_ARG[@]}"
          fi

  # The same build on older and Intel Macs: the tests, then the finished app itself (screenshots of every
  # style and a short run in the background), so problems there show up before users meet them.
  compat:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Mac and toolchain
        run: |
          sw_vers
          echo "Chip: $(uname -m)"
          swift --version

      - name: Run tests
        run: swift test

      - name: Get the built app
        uses: actions/download-artifact@v4
        with:
          name: Fussel
          path: dist

      - name: Start the app
        run: |
          ditto -x -k dist/Fussel.zip dist
          APP=dist/Fussel.app/Contents/MacOS/Fussel
          lipo -archs "$APP"
          "$APP" --render-previews "$PWD/previews"
          echo "Screenshots: $(ls previews | wc -l)"
          "$APP" > run.log 2>&1 &
          pid=$!
          sleep 20
          if kill -0 "$pid" 2>/dev/null; then
            echo "Fussel is still running after 20 s, using $(ps -o %cpu= -p "$pid")% CPU"
            kill "$pid"
          else
            echo "::error::Fussel quit on its own"; cat run.log; exit 1
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: previews-${{ matrix.os }}
          path: previews
